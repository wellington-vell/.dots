# Capture indicators and behavior on the Noctalia bar:
# - privacy: mic / camera / screen-share activity
# - recorder: noctalia/screen_recorder widget (red while recording)
# - screenshot: built-in wlr-screencopy capture; policy under [shell.screenshot]

[plugins]
enabled = ["noctalia/screen_recorder"]
auto_update = "official"

[plugin_settings."noctalia/screen_recorder"]
hide_inactive = false
video_source = "portal"
directory = "~/Videos/Recordings"
show_cursor = true
# Always-visible bar indicator: gray/video when idle, primary while starting,
# red while recording, repeat while the replay buffer is armed.
glyph_idle = "video"
glyph_pending = "video"
glyph_recording = "video-filled"
glyph_replaying = "repeat"

[shell.screenshot]
save_to_file = true
directory = "~/Pictures/Screenshots"
copy_to_clipboard = true
freeze_screen = true

[widget.screenshot]
glyph = "screenshot"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[bar.default]
end = [
  "media",
  "privacy",
  "recorder",
  "screenshot",
  "tray",
  "notifications",
  "clipboard",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "control-center",
  "session",
]
